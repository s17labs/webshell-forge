name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (no Java needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-apk:
    name: E2E — scaffold sample + assembleDebug
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Scaffold sample app from vendored template
        run: node scripts/e2e-scaffold.mjs projects/sample

      - name: Verify stamping happened
        run: |
          grep -q 'applicationId = "com.webshellforge.forgesample"' projects/sample/app/build.gradle.kts
          grep -q '<string name="app_name">Forge Sample</string>' projects/sample/app/src/main/res/values/strings.xml
          test -f projects/sample/app/src/main/assets/www/index.html
          grep -q 'bridge.js' projects/sample/app/src/main/assets/www/index.html
          echo "stamping OK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('templates/webshell/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: projects/sample
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp projects/sample/app/build/outputs/apk/debug/app-debug.apk dist/forge-sample-v1.0.0-debug.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: forge-sample-debug-apk
          path: dist/*.apk
          if-no-files-found: error
